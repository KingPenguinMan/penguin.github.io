<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="660" viewBox="0 0 1440 660" role="img" aria-label="可选：从 Telegram 操作任务">
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101c36"/><stop offset="1" stop-color="#143d4b"/></linearGradient><marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0 0L7 3L0 6" fill="none" stroke="#65dcc6" stroke-width="2"/></marker></defs>
<rect width="1440" height="660" rx="28" fill="url(#bg)"/><circle cx="1330" cy="65" r="180" fill="#54cbb7" opacity=".06"/>
<g font-family="Segoe UI,Microsoft YaHei,sans-serif"><text x="76" y="98" fill="#65dcc6" font-size="19" letter-spacing="4">HEYBOX · DAILY CHECK-IN</text><text x="76" y="165" fill="#fff" font-size="46" font-weight="700">可选：从 Telegram 操作任务</text><text x="78" y="211" fill="#adc2d5" font-size="23">Bot 是控制入口，GitHub Actions 负责实际执行</text>
<g transform="translate(76,278)"><rect width="396" height="215" rx="20" fill="#fff" fill-opacity=".07" stroke="#fff" stroke-opacity=".15"/><text x="28" y="48" fill="#65dcc6" font-size="20">01</text><text x="28" y="100" fill="#fff" font-size="30" font-weight="600">Telegram</text><text x="28" y="145" fill="#bbccdc" font-size="21">管理员选择账号</text><text x="28" y="179" fill="#bbccdc" font-size="21">查询 / 补签 / 查看活动</text></g><path d="M488 385h27" stroke="#65dcc6" stroke-width="3" marker-end="url(#arrow)"/><g transform="translate(524,278)"><rect width="396" height="215" rx="20" fill="#fff" fill-opacity=".07" stroke="#fff" stroke-opacity=".15"/><text x="28" y="48" fill="#65dcc6" font-size="20">02</text><text x="28" y="100" fill="#fff" font-size="30" font-weight="600">Cloudflare Worker</text><text x="28" y="145" fill="#bbccdc" font-size="21">验证身份与指令</text><text x="28" y="179" fill="#bbccdc" font-size="21">KV 保存所选账号状态</text></g><path d="M936 385h27" stroke="#65dcc6" stroke-width="3" marker-end="url(#arrow)"/><g transform="translate(972,278)"><rect width="396" height="215" rx="20" fill="#fff" fill-opacity=".07" stroke="#fff" stroke-opacity=".15"/><text x="28" y="48" fill="#65dcc6" font-size="20">03</text><text x="28" y="100" fill="#fff" font-size="30" font-weight="600">GitHub Actions</text><text x="28" y="145" fill="#bbccdc" font-size="21">读取对应账号 Secret</text><text x="28" y="179" fill="#bbccdc" font-size="21">执行任务并回传结果</text></g>
<path d="M78 545h1280" stroke="#fff" stroke-opacity=".12"/><text x="78" y="593" fill="#c2d3e0" font-size="22">只收通知无需部署 Worker  /  抽奖参与需要再次确认  /  图为流程示意，非控制台截图</text></g></svg>
