<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="660" viewBox="0 0 1440 660" role="img" aria-label="把配置放到正确的位置">
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101c36"/><stop offset="1" stop-color="#143d4b"/></linearGradient><marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0 0L7 3L0 6" fill="none" stroke="#65dcc6" stroke-width="2"/></marker></defs>
<rect width="1440" height="660" rx="28" fill="url(#bg)"/><circle cx="1330" cy="65" r="180" fill="#54cbb7" opacity=".06"/>
<g font-family="Segoe UI,Microsoft YaHei,sans-serif"><text x="76" y="98" fill="#65dcc6" font-size="19" letter-spacing="4">HEYBOX · DAILY CHECK-IN</text><text x="76" y="165" fill="#fff" font-size="46" font-weight="700">把配置放到正确的位置</text><text x="78" y="211" fill="#adc2d5" font-size="23">账号 JSON、Secret 与执行槽位一一对应</text>
<g transform="translate(76,278)"><rect width="396" height="215" rx="20" fill="#fff" fill-opacity=".07" stroke="#fff" stroke-opacity=".15"/><text x="28" y="48" fill="#65dcc6" font-size="20">01</text><text x="28" y="100" fill="#fff" font-size="30" font-weight="600">本地配置文件</text><text x="28" y="145" fill="#bbccdc" font-size="21">private/config.json</text><text x="28" y="179" fill="#bbccdc" font-size="21">复制完整 JSON 内容</text></g><path d="M488 385h27" stroke="#65dcc6" stroke-width="3" marker-end="url(#arrow)"/><g transform="translate(524,278)"><rect width="396" height="215" rx="20" fill="#fff" fill-opacity=".07" stroke="#fff" stroke-opacity=".15"/><text x="28" y="48" fill="#65dcc6" font-size="20">02</text><text x="28" y="100" fill="#fff" font-size="30" font-weight="600">仓库 Secret</text><text x="28" y="145" fill="#bbccdc" font-size="21">HEYBOX_CONFIG_JSON</text><text x="28" y="179" fill="#bbccdc" font-size="21">Settings → Secrets → Actions</text></g><path d="M936 385h27" stroke="#65dcc6" stroke-width="3" marker-end="url(#arrow)"/><g transform="translate(972,278)"><rect width="396" height="215" rx="20" fill="#fff" fill-opacity=".07" stroke="#fff" stroke-opacity=".15"/><text x="28" y="48" fill="#65dcc6" font-size="20">03</text><text x="28" y="100" fill="#fff" font-size="30" font-weight="600">任务账号 1</text><text x="28" y="145" fill="#bbccdc" font-size="21">运行时临时读取</text><text x="28" y="179" fill="#bbccdc" font-size="21">凭证不提交到源码仓库</text></g>
<path d="M78 545h1280" stroke="#fff" stroke-opacity=".12"/><text x="78" y="593" fill="#c2d3e0" font-size="22">朋友账号使用 HEYBOX_CONFIG_2 ～ HEYBOX_CONFIG_5，避免覆盖主账号</text></g></svg>
